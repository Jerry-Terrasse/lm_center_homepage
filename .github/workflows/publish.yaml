name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: '0.145.0'

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ["dev-lm-center"]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build website
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
        fetch-depth: 0
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: ${{ env.WC_HUGO_VERSION }}
        extended: true
    - uses: actions/cache@v3
      with:
        path: /tmp/hugo_cache_runner/
        key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.mod') }}
        restore-keys: |
          ${{ runner.os }}-hugomod-
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5
    - name: Build with Hugo
      env:
        HUGO_ENVIRONMENT: production
      run: |
        echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
        hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
    # - name: Generate Pagefind search index
    #   run: npx pagefind --site "public"
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public
    - name: Build for the WebPlus platform
      run: |
        ./release.sh # release.zip created is actually not used
    - name: Upload artifact without videos and images
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: | # use wildcard to prevent top-level directory
          public/*
          !public/**/*.mp4
          !public/**/*.jpg
          !public/**/*.png
    - name: Upload artifact with images but without videos
      uses: actions/upload-artifact@v4
      with:
        name: release_with_images
        path: |
          public/*
          !public/**/*.mp4
    - name: Upload artifact with all files
      uses: actions/upload-artifact@v4
      with:
        name: release_with_all
        path: |
          public/*

  # Deploy website to GitHub Pages hosting
  deploy:
    if: github.repository_owner != 'HugoBlox'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
